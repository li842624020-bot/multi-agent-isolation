<div class="mai-settings-container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Multi-Agent 信息隔离</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <!-- 主开关 -->
            <div class="mai-section">
                <label class="checkbox_label">
                    <input id="mai_enabled" type="checkbox" />
                    <span>启用多Agent模式</span>
                </label>
                <small class="mai-hint">启用后，不同角色将由独立AI实例扮演，实现真正的信息隔离</small>
            </div>

            <hr />

            <!-- 角色管理 -->
            <div class="mai-section">
                <h4>当前在场角色</h4>
                <div id="mai_present_characters" class="mai-character-list">
                    <div class="mai-empty-state">暂无在场角色，开始对话后自动识别</div>
                </div>
                <div class="mai-add-character">
                    <input id="mai_add_character_input" type="text" placeholder="输入角色名..." class="text_pole" />
                    <div id="mai_add_character_btn" class="menu_button" title="添加角色">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                </div>
            </div>

            <hr />

            <!-- 自动识别设置 -->
            <div class="mai-section">
                <h4>自动识别</h4>
                <label class="checkbox_label">
                    <input id="mai_auto_detect" type="checkbox" />
                    <span>自动识别角色出场/离场</span>
                </label>
                <label class="checkbox_label">
                    <input id="mai_auto_npc" type="checkbox" />
                    <span>自动生成临时NPC设定</span>
                </label>
            </div>

            <hr />

            <!-- Agent API 设置 -->
            <div class="mai-section">
                <h4>角色Agent API设置</h4>
                <small class="mai-hint">留空则自动复用SillyTavern当前API配置。支持所有OpenAI兼容格式（包括中转站）和Anthropic原生格式，根据URL自动识别。</small>
                <label>
                    <span>API URL</span>
                    <input id="mai_agent_url" type="text" placeholder="如 https://api.openai.com/v1 或 https://api.anthropic.com/v1" class="text_pole" />
                </label>
                <label>
                    <span>API Key</span>
                    <input id="mai_agent_key" type="password" placeholder="sk-... 或 anthropic key" class="text_pole" />
                </label>
                <label>
                    <span>模型名称</span>
                    <input id="mai_agent_model" type="text" placeholder="如 gpt-4o-mini / claude-3-haiku-20240307" class="text_pole" />
                </label>
                <small class="mai-hint">提示：角色Agent推荐用便宜快速的模型（如 gpt-4o-mini、claude-3-haiku），最终输出质量由SillyTavern主模型决定。</small>
            </div>

            <hr />

            <!-- 破限提示词 -->
            <div class="mai-section">
                <h4>角色Agent通用提示词</h4>
                <small class="mai-hint">此内容会添加到每个角色Agent的系统提示词开头（用于破限等）</small>
                <textarea id="mai_jailbreak" class="text_pole textarea_compact" rows="4" placeholder="粘贴你的破限提示词..."></textarea>
            </div>

            <hr />

            <!-- 调试 -->
            <div class="mai-section">
                <h4>调试</h4>
                <label class="checkbox_label">
                    <input id="mai_debug" type="checkbox" />
                    <span>显示调试信息</span>
                </label>
                <div id="mai_debug_output" class="mai-debug-panel" style="display:none;"></div>
            </div>
        </div>
    </div>
</div>
